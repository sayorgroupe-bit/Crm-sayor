function docKind(x){ const m=String(x.mime||''), n=String(x.nom||'').toLowerCase(); if(m.indexOf('pdf')>-1 || n.slice(-4)==='.pdf') return 'PDF'; if(m.indexOf('image/')===0) return 'IMG'; return 'DOC'; }
const fmtSize = n => !n ? '' : n<1024*1024 ? Math.max(1,Math.round(n/1024))+' Ko' : (n/1048576).toFixed(1).replace('.',',')+' Mo';
function gs(fn,...args){
  if(!window.SAYOR_RUN) return Promise.reject(new Error('Serveur indisponible'));
  return window.SAYOR_RUN(fn,[window.SAYOR_SITE?.token?.()||'',...args]).then(r=>{ if(r&&r.error){ const e=new Error(r.error); e.code=r.code; e.url=r.url; throw e; } return r||{}; });
}
const readB64 = blob => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(new Error('Lecture du fichier impossible')); r.readAsDataURL(blob); });
/* photos trop lourdes : réduites en JPEG (2400 px max) avant envoi */
async function shrinkImage(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size<2.5*1024*1024) return file;
  try{
    const url=URL.createObjectURL(file); const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k=Math.min(1,2400/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    const b=await new Promise(res=>c.toBlob(res,'image/jpeg',0.85)); if(!b || b.size>=file.size) return file;
    return new File([b], file.name.replace(/\.(png|webp)$/i,'.jpg'), {type:'image/jpeg'});
  }catch(e){ return file; }
}
function withTimeout(p, ms, label){ return new Promise(function(res,rej){ var tm=setTimeout(function(){ rej(new Error(label+' : pas de réponse après '+Math.round(ms/1000)+' secondes')); }, ms); p.then(function(v){ clearTimeout(tm); res(v); }, function(e){ clearTimeout(tm); rej(e); }); }); }
async function uploadDocs(id, d, inp, t){
  var files=Array.prototype.slice.call(inp.files||[]); if(!files.length) return;
  var msg=$('#doc-msg'); var ok=0; var nomClient=d ? fullName(d) : 'Client'; inp.disabled=true;
  for(var i=0;i<files.length;i++){
    var f0=files[i]; var etape='préparation';
    var pre='Fichier '+(i+1)+' sur '+files.length+' ('+f0.name+', '+fmtSize(f0.size)+') : ';
    msg.className='small muted'; msg.textContent=pre+'préparation…';
    try{
      var f=await shrinkImage(f0);
      if(f.size>25*1024*1024) throw new Error('fichier trop lourd (25 Mo maximum)');
      etape='lecture du fichier'; msg.textContent=pre+'lecture du fichier…';
      var data=await withTimeout(readB64(f), 60000, 'Lecture du fichier');
      etape='envoi vers Google Drive'; msg.textContent=pre+'envoi vers Google Drive…';
      var r=await withTimeout(gs('docUpload',{dossierId:id, nom:nomClient, name:f.name, mime:f.type, data:data}), 180000, 'Envoi vers Google Drive');
      etape='enregistrement dans le dossier'; msg.textContent=pre+'enregistrement dans le dossier…';
      await withTimeout(db.collection('documents').add({dossierId:id, type:t, nom:r.name||f.name, fileId:r.fileId, url:r.url||'', taille:r.size||f.size, mime:f.type||'', at:new Date().toISOString(), by:S.me.id||null}), 60000, 'Enregistrement');
      ok++;
    }catch(e){ msg.className='small neg'; msg.textContent='« '+f0.name+' » non envoyé (étape : '+etape+') : '+((e&&e.message)||e); inp.disabled=false; inp.value=''; return; }
  }
  inp.disabled=false; inp.value='';
  toast(ok>1 ? ok+' documents ajoutés' : 'Document ajouté'); renderDocs(id);
}

    renderDocs(id); });

let pdfLib=null;
async function loadPdf(){
  if(pdfLib) return pdfLib;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=base+'pdf.min.js'; s.onload=res; s.onerror=()=>rej(new Error('Lecteur PDF indisponible')); document.head.appendChild(s); });
  try{ const w=await fetch(base+'pdf.worker.min.js').then(r=>r.text()); window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'})); }
  catch(e){ window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'; }
  return (pdfLib=window.pdfjsLib);
}
function closeDocView(){ const v=$('#docview'); if(v) v.remove(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#docview')){ e.stopImmediatePropagation(); closeDocView(); } },true);
async function viewDoc(x){
  if(!x) return; closeDocView();
  const v=document.createElement('div'); v.id='docview'; v.setAttribute('role','dialog'); v.setAttribute('aria-modal','true'); v.setAttribute('aria-label',x.nom||'Document');
  v.innerHTML=`<div class="dv-head"><div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.nom||'Document')}</b><span class="small muted">${esc(x.type||'')}</span></div>
    ${x.url?`<a class="btn sm" href="${esc(x.url)}" target="_blank" rel="noopener">Ouvrir dans Drive</a>`:''}<button type="button" class="btn sm" id="dv-close">${ic('x')}Fermer</button></div><div class="dv-body" id="dv-body"><div class="muted">Chargement…</div></div>`;
  document.body.appendChild(v); $('#dv-close').onclick=closeDocView;
  const body=$('#dv-body');
  try{
    const r=await gs('docGet',x.fileId); if(!$('#docview')) return;
    const mime=r.mime||x.mime||'';
    if(mime.indexOf('image/')===0){ body.innerHTML=`<img alt="${esc(x.nom||'')}" src="data:${mime};base64,${r.data}">`; }
    else if(mime.toLowerCase().indexOf('pdf')>-1){
      const lib=await loadPdf(); const raw=atob(r.data); const bytes=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
      const pdf=await lib.getDocument({data:bytes}).promise; if(!$('#docview')) return; body.innerHTML='';
      const n=Math.min(pdf.numPages,30), w=Math.min(body.clientWidth-8||800,1000);
      for(let p=1;p<=n;p++){ const page=await pdf.getPage(p); const vp0=page.getViewport({scale:1}); const sc=w/vp0.width*(window.devicePixelRatio||1); const vp=page.getViewport({scale:sc});
        const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.style.width=w+'px'; body.appendChild(c); await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; if(!$('#docview')) return; }
      if(pdf.numPages>n) body.insertAdjacentHTML('beforeend',`<p class="muted small">Seules les ${n} premières pages sont affichées.</p>`);
    } else body.innerHTML=`<p>Aperçu impossible pour ce type de fichier.</p>${x.url?`<p><a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Ouvrir dans Drive</a></p>`:''}`;
  }catch(e){ if($('#dv-body')) $('#dv-body').innerHTML=`<p class="neg">Impossible d’afficher le document : ${esc(e.message)}</p>${x.url||e.url?`<p><a class="btn" href="${esc(x.url||e.url)}" target="_blank" rel="noopener">Ouvrir dans Drive</a></p>`:''}`; }
}

/* ============ Doublons possibles (même téléphone, même mail, ou même nom + code postal) ============ */
const dupKeys = d => { const c=d.client||{}, k=[];
  const tel=String(c.tel||'').replace(/\D/g,'').slice(-9); if(tel.length===9) k.push('t'+tel);
  const mail=String(c.email||'').trim().toLowerCase(); if(mail.includes('@')) k.push('m'+mail);
  const nom=norm(c.nom||''), cp=String(c.cp||'').trim(); if(nom && cp) k.push('n'+nom+'|'+cp);
  return k; };
function dupIndex(){
  if(dupIndex.src===S.dossiers) return dupIndex.map;
  const byKey={}, map={};
  S.dossiers.forEach(d=>{ if(d.statut==='Annulé') return; dupKeys(d).forEach(k=>{ (byKey[k] ||= []).push(d.id); }); });
  Object.values(byKey).forEach(ids=>{ if(ids.length<2) return; ids.forEach(a=>{ ids.forEach(b=>{ if(a!==b){ (map[a] ||= new Set()).add(b); } }); }); });
  dupIndex.src=S.dossiers; dupIndex.map=map; return map;
}
const dupsOf = d => isRegie() ? [] : [...(dupIndex()[d.id]||[])].map(id=>S.dossiers.find(x=>x.id===id)).filter(Boolean);
const dupTag = d => dupsOf(d).length ? ` <span class="tag" style="background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)">Doublon possible</span>` : '';
function dupAlert(d){
  const l=d?dupsOf(d):[]; if(!l.length) return '';
  return `<div class="panel" style="border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent);padding:12px 14px;margin-bottom:14px">

const REGIE_STATUTS = STATUTS;
const isRegie = () => !!S.me.regie;
const regieCout = d => d.regie ? n0(d.regieMontant)+n0(d.regieMontantMPR) : 0;
function regieStats(r){
  const ds=S.dossiers.filter(d=>d.regie===r.nom);
  const act=ds.filter(actif), inst=act.filter(d=>d.statut==='Installé');
  const duCEE=inst.reduce((a,d)=>a+n0(d.regieMontant),0), duMPR=inst.reduce((a,d)=>a+n0(d.regieMontantMPR),0);
  const du=duCEE+duMPR;
  const avenir=act.filter(d=>d.statut!=='Installé').reduce((a,d)=>a+regieCout(d),0);
  const sansCom=act.filter(d=>(d.regieMontant==null||d.regieMontant==='')&&(d.regieMontantMPR==null||d.regieMontantMPR==='')).length;
  const pays=S.paiements.filter(p=>p.type==='regie'&&p.cible===r.nom);
  const payeCEE=pays.filter(p=>p.objet!=='MPR').reduce((a,p)=>a+n0(p.montant),0), payeMPR=pays.filter(p=>p.objet==='MPR').reduce((a,p)=>a+n0(p.montant),0);
  const paye=payeCEE+payeMPR;
  return {ds,duCEE,duMPR,du,avenir,sansCom,payeCEE,payeMPR,paye,reste:du-paye,resteCEE:duCEE-payeCEE,resteMPR:duMPR-payeMPR};
}

async function saveDossierRegie(){
  if(saveDossierRegie.busy) return;

  if(o.client.nom) o.client.nom=o.client.nom.toUpperCase();
  if(o.proprietaire?.nom) o.proprietaire.nom=o.proprietaire.nom.toUpperCase();
  if(!o.client.nom){ msg.textContent='Indiquez au moins le nom du client.'; msg.className='msg neg'; $('#f-client-nom').focus(); return; }

  const keep=['occupant','client','proprietaire','statut','ceeCouleur','mprCouleur','rac','marque','modele','tech','notes','infos'];
  const changes = cur.id? diff(cur.orig,o).filter(c=>keep.includes(c.champ.split('.')[0])) : [];
  if(cur.id && !changes.length){ closeSheet(); return; }
  const data={}; keep.forEach(k=>{ if(o[k]!==undefined) data[k]=o[k]; });
  btn.disabled=true; saveDossierRegie.busy=true; msg.className='msg muted'; msg.textContent='Enregistrement…';
  try{
    const ref = cur.id? db.collection('dossiers').doc(cur.id) : db.collection('dossiers').doc();
    await ref.set(data);
    try{ await db.collection('historique').add({dossierId:ref.id, type:cur.id?'modif':'creation', changes:changes.map(c=>({...c, label:LABELS[c.champ]}))}); }catch(e){}
    saveDossierRegie.busy=false;
    toast(cur.id?'Modifications enregistrées':'Dossier créé : il est transmis à Sayor Groupe');
    if(cur.id) closeSheet(); else { const nid=ref.id; closeSheet(); setTimeout(()=>{ if(S.dossiers.some(x=>x.id===nid)) openDossier(nid); },1500); }
  }catch(e){ saveDossierRegie.busy=false; btn.disabled=false; msg.className='msg neg'; msg.textContent='Enregistrement impossible : '+(e.message||e.code); }
}

function autoRappels(){
  const out=[]; const today=TODAY(); const in7=ymd(new Date(Date.now()+7*864e5));
  S.dossiers.filter(actif).forEach(d=>{ const n=fullName(d);
    if(d.statut==='À confirmer') out.push({cat:'Dossiers à confirmer',txt:`Confirmer le dossier ${n}`,id:d.id,c:'var(--s-aconf)'});
    { const dl=dupsOf(d); if(dl.length && (d.regie || dl.every(x=>!x.regie && x.id<d.id))) out.push({cat:'Doublons possibles',txt:`${n}${d.regie?' ('+d.regie+')':''} : même client qu’un autre dossier`,id:d.id,c:'var(--bad)'}); }
    if(d.statut==='Docs reçus') out.push({cat:'Docs reçus : pose à placer',txt:`${n}${d.regie?' ('+d.regie+')':''} : documents reçus, placer la pose`,id:d.id,c:'var(--s-drecus)'});
    if(d.statut==='Installé' && d.regie && (d.regieMontant==null||d.regieMontant==='')) out.push({cat:'Commissions régie à renseigner',txt:`${n} : commission ${d.regie} à renseigner`,id:d.id,c:'var(--warn)'});
    if(d.statut==='En attente') out.push({cat:'Dossiers en attente',txt:`${n} est en attente`,id:d.id,c:'var(--s-attente)'});
    if(!d.datePose && ['Confirmé','Pose à placer','Devis signé'].includes(d.statut)) out.push({cat:'Poses à planifier',txt:`Fixer la date de pose — ${n}`,id:d.id,c:'var(--s-placer)'});
    if(d.datePose && d.statut!=='Installé' && d.datePose>=today && d.datePose<=in7) out.push({cat:'Poses dans les 7 jours',txt:`Pose le ${fmtDate(d.datePose)} — ${n}${d.poseur?' ('+d.poseur+')':''}`,id:d.id,c:'var(--s-fixee)'});
    if(d.datePose && d.statut!=='Installé' && d.datePose<today) out.push({cat:'Poses passées',txt:`Pose du ${fmtDate(d.datePose)} passée : passer ${n} en Installé ?`,id:d.id,c:'var(--bad)'});
    if(n0(d.rac) && n0(d.racPaye)<n0(d.rac)) out.push({cat:'Reste à charge à encaisser',txt:`${n} : reste ${eur(n0(d.rac)-n0(d.racPaye))} à payer sur ${eur(d.rac)}`,id:d.id,c:'var(--warn)'});
    if(d.statut==='Installé' && d.ceeStatut==='En attente') out.push({cat:'CEE à déposer',txt:`Déposer le dossier CEE — ${n}`,id:d.id,c:'var(--cee-bleu)'});
    if(d.statut==='Installé' && d.ceeStatut==='Dossier déposé') out.push({cat:'CEE à encaisser',txt:`CEE déposé, paiement attendu — ${n}`,id:d.id,c:'var(--cee-bleu)'});
    if(d.statut==='Installé' && d.mprStatut==='À faire') out.push({cat:'MPR à demander',txt:`Faire la demande MPR — ${n}`,id:d.id,c:'var(--cee-violet)'});
    if(d.statut==='Installé' && ['Demande faite','Accord'].includes(d.mprStatut)) out.push({cat:'MPR à encaisser',txt:`MPR ${d.mprStatut.toLowerCase()}, paiement attendu — ${n}`,id:d.id,c:'var(--cee-violet)'});
    if(['Installé','Pose fixée'].includes(d.statut) && (!d.ceeCouleur || (!d.mprCouleur && d.mprStatut!=='Non concerné'))) out.push({cat:'Couleurs à renseigner',txt:`Renseigner la couleur CEE/MPR — ${n}`,id:d.id,c:'var(--muted)'});
  });
  S.sav.filter(s=>s.statut!=='Résolu').forEach(s=>{ const d=S.dossiers.find(x=>x.id===s.dossierId); out.push({cat:'SAV ouverts',txt:`SAV ${s.statut.toLowerCase()} — ${d?fullName(d):'dossier'}`,id:d?.id,c:'var(--bad)'}); });
  S.cfg.fournisseurs.forEach(f=>{ const s=fournisseurStats(f); if(s.reste>0) out.push({cat:'Paiements à faire',txt:`${f.nom} : reste ${eur(s.reste)} à payer`,c:'var(--warn)'}); });
  S.cfg.poseurs.forEach(p=>{ const s=poseurStats(p); if(s.reste>0) out.push({cat:'Paiements à faire',txt:`${p.nom} : reste ${eur(s.reste)} à payer`,c:'var(--warn)'}); });
  S.cfg.regies.forEach(r=>{ const s=regieStats(r); if(s.reste>0) out.push({cat:'Paiements à faire',txt:`Régie ${r.nom} : reste ${eur(s.reste)} à payer`,c:'var(--warn)'}); });
  S.cfg.commerciaux.forEach(c=>{ const s=commercialStats(c); if(s.reste>0) out.push({cat:'Paiements à faire',txt:`${c.nom} : reste ${eur(s.reste)} de commissions`,c:'var(--warn)'}); });
  return out;
}

  const ORDER=['Poses passées','Poses dans les 7 jours','Dossiers à confirmer','Poses à planifier','CEE à déposer','MPR à demander','SAV ouverts','Paiements à faire','Reste à charge à encaisser','CEE à encaisser','MPR à encaisser','Couleurs à renseigner','Dossiers en attente'];
  const man=[...S.rappels].sort((a,b)=>(a.fait-b.fait)||(a.date||'').localeCompare(b.date||''));

  v.innerHTML = topBar('Rappels')+`
  <div class="grid cols-2">
    <div class="panel"><div class="panel-head"><h2>Mes rappels</h2></div>
      ${S.canWrite?`<form id="rap-form" class="fg" style="margin-bottom:12px"><div class="f c4"><label for="rap-t">Rappel</label><input class="inp" id="rap-t" name="t" placeholder="Ex. : rappeler le client pour l’accord MPR" required></div>

        <div class="f c2"><label for="rap-dos">Dossier (facultatif)</label><select class="inp" id="rap-dos" name="dos"><option value="">Aucun</option>${ds.map(d=>`<option value="${d.id}">${esc(fullName(d))}</option>`).join('')}</select></div>
        <div class="f c4"><button class="btn primary" type="submit">Ajouter le rappel</button></div></form>`:''}
      <div class="list">${man.map(r=>{ const d=S.dossiers.find(x=>x.id===r.dossierId); const late=!r.fait&&r.date&&r.date<TODAY();
        return `<div class="li" style="cursor:default"><input type="checkbox" data-rapfait="${r.id}" ${r.fait?'checked':''} ${S.canWrite?'':'disabled'} aria-label="Fait" style="width:20px;height:20px">
        <div class="grow"><div class="t" style="${r.fait?'text-decoration:line-through;opacity:.6':''}">${esc(r.texte)}</div><div class="small ${late?'neg':'muted'}">${r.date?fmtDate(r.date,{day:'numeric',month:'long'}):''}${d?` · <a href="#" data-open="${d.id}" style="color:inherit">${esc(fullName(d))}</a>`:''}</div></div>
        ${S.canWrite?`<button class="btn sm ghost" data-rapdel="${r.id}">Suppr.</button>`:''}</div>`; }).join('')||'<div class="empty">Aucun rappel manuel.</div>'}</div></div>
    <div class="panel"><div class="panel-head"><h2>Rappels automatiques</h2><span class="small muted">${auto.length}</span></div>
      ${ORDER.filter(k=>groups[k]).map(k=>`<details ${['Poses passées','Poses dans les 7 jours','Dossiers à confirmer','CEE à déposer','MPR à demander','SAV ouverts','Paiements à faire'].includes(k)?'open':''} style="padding:6px 0;border-top:1px solid var(--line)"><summary>${k} (${groups[k].length})</summary><div class="rem-group" style="margin-top:4px">${groups[k].map(remLi).join('')}</div></details>`).join('')||'<div class="empty">Rien à signaler.</div>'}
    </div></div>`;
  $('#rap-form')?.addEventListener('submit',async e=>{ e.preventDefault(); const f=e.target;
    try{ await db.collection('rappels').add({texte:f.t.value.trim(),date:f.d.value,dossierId:f.dos.value||null,fait:false,at:new Date().toISOString(),by:S.me.id||null}); toast('Rappel ajouté'); f.reset(); f.d.value=TODAY(); }catch(err){ toast('Rappel non enregistré'); } refresh(); });
  $$('[data-rapfait]',v).forEach(c=>c.addEventListener('change',async()=>{ try{ await db.collection('rappels').doc(c.dataset.rapfait).update({fait:c.checked}); }catch(e){} c.blur(); }));
  $$('[data-rapdel]',v).forEach(b=>b.onclick=async()=>{ if(!b.dataset.armed){ b.dataset.armed=1; b.textContent='Confirmer'; b.classList.add('danger'); return; } try{ await db.collection('rappels').doc(b.dataset.rapdel).delete(); }catch(e){} });
}

function loadXLSX(){ return window.XLSX? Promise.resolve() : new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res; s.onerror=()=>rej(new Error('bibliothèque Excel indisponible, exportez en CSV')); document.head.appendChild(s); }); }
function parseCSV(txt){
  txt=txt.replace(/^﻿/,''); const first=txt.split('\n')[0]||''; const delim = first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
  const out=[]; let row=[], f='', q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===delim){ row.push(f); f=''; } else if(c==='\n'){ row.push(f); out.push(row); row=[]; f=''; } else if(c!=='\r') f+=c; }
  if(f||row.length){ row.push(f); out.push(row); } return out;
}
const mapStatut = s => { const n=norm(s); if(!n) return 'En attente'; return STATUTS.find(x=>norm(x)===n) || (n.startsWith('INSTALL')?'Installé':n.includes('PLACER')?'Pose à placer':n.includes('FIXE')?'Pose fixée':n.includes('ANNUL')?'Annulé':n.includes('SIGN')?'Devis signé':n.includes('ENVOY')?'Devis envoyé':n.includes('CONFIRMER')?'À confirmer':n.includes('CONFIRM')?'Confirmé':'En attente'); };
const mapCEE = s => { const n=norm(s); return n.startsWith('PAYE')?'Payé':n.startsWith('DEPOS')?'Dossier déposé':'En attente'; };
const mapMPR = s => { const n=norm(s); if(!n) return 'À faire'; return n.startsWith('PAYE')?'Payé':n.startsWith('ACCORD')?'Accord':n.includes('FAITE')?'Demande faite':n.includes('NON')?'Non concerné':'À faire'; };
const mapCoul = s => COULEURS.find(c=>norm(c)===norm(s))||'';
function toIso(s){ s=String(s||'').trim(); let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/); if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; } m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?m[0]:''; }
function previewImport(rows){
  const msg=$('#imp-msg'), out=$('#imp-out'); rows=(rows||[]).filter(r=>r.some(c=>String(c).trim()));
  if(rows.length<2){ msg.textContent='Aucune ligne trouvée.'; out.innerHTML=''; return; }
  let hi=rows.findIndex(r=>r.some(c=>norm(c)==='NOM')); if(hi<0){ msg.textContent='Colonne « NOM » introuvable dans l’en-tête.'; return; }
  const H=rows[hi].map(norm); const col=(...names)=>H.findIndex(h=>names.some(n=>h===n||h.startsWith(n+' ')));
  const c={nom:col('NOM'),prenom:col('PRENOM'),adr:col('ADRESSE'),cp:col('CP','CODE POSTAL'),ville:col('VILLE'),tel:col('TELEPHONE','TEL'),email:col('EMAIL','MAIL'),statut:col('STATUT'),com:col('COMMERCIAL'),notes:col('NOTES'),
    date:col('DATE POSE','DATE DE POSE'),poseur:col('POSEUR'),four:col('FOURNISSEUR'),marque:col('MARQUE'),mat:col('MATERIEL'),pose:col('POSE'),app:col('BONUS APPORTEUR (MPR)','BONUS APPORTEUR'),comm:col('APPORTE UR','APPORTEUR'),caCee:col('CA CEE'),mprR:col('MPR (NON COMPTE)'),mprP:col('MPR PAYE ?'),mprD:col('DETAIL MPR'),cee:col('CEE','INFINITY','STATUT CEE'),mpr:col('MPR','MPR (STATUT)','STATUT MPR'),cc:col('COULEUR CEE'),cm:col('COULEUR MPR')};
  const g=(r,k)=>c[k]>=0?String(r[c[k]]??'').trim():'';
  const existing=new Set(S.dossiers.map(d=>norm([d.client?.nom,d.client?.prenom,d.client?.cp].join('|'))));
  const news=[]; let dup=0;
  rows.slice(hi+1).forEach(r=>{ const nom=g(r,'nom').toUpperCase(); if(!nom || norm(nom).startsWith('TOTAL')) return;
    const key=norm([nom,g(r,'prenom'),g(r,'cp')].join('|')); if(existing.has(key)){ dup++; return; } existing.add(key);
    const com=g(r,'com').toUpperCase(); const d=blankDossier();
    Object.assign(d,{client:{nom,prenom:g(r,'prenom'),adresse:g(r,'adr'),cp:g(r,'cp'),ville:g(r,'ville'),tel:g(r,'tel'),email:g(r,'email')},statut:mapStatut(g(r,'statut')),commercial:com==='CALL'?'LE CALL':com,
      notes:g(r,'notes'),datePose:toIso(g(r,'date')),poseur:g(r,'poseur').toUpperCase(),fournisseur:g(r,'four').toUpperCase(),marque:g(r,'marque'),materiel:num(g(r,'mat')),pose:num(g(r,'pose')),bonusApporteur:num(g(r,'app')),commission:num(g(r,'comm')),ceeReel:num(g(r,'caCee')),mprReel:num(g(r,'mprR')),
      ceeStatut:mapCEE(g(r,'cee')),mprStatut:norm(g(r,'mprP')).includes('PAYE')&&!norm(g(r,'mprP')).includes('ATTENTE')?'Payé':mapMPR(g(r,'mprD')||g(r,'mpr')),ceeCouleur:mapCoul(g(r,'cc')),mprCouleur:mapCoul(g(r,'cm'))});
    news.push(d); });
  msg.textContent=`${news.length} dossier(s) à importer · ${dup} déjà présent(s), ignoré(s).`;
  out.innerHTML = news.length? `<div class="list" style="margin-top:10px;max-height:260px;overflow:auto">${news.map(d=>`<div class="li" style="cursor:default"><div class="grow"><div class="t">${esc(fullName(d))}</div><div class="small muted">${esc(d.client.ville)} · ${esc(d.commercial||'—')}</div></div>${badge(d.statut)}</div>`).join('')}</div>
    <button class="btn primary" id="imp-go" style="margin-top:10px">Importer ${news.length} dossier(s)</button>` : '';
  $('#imp-go')?.addEventListener('click',async e=>{ const b=e.target; b.disabled=true; let ok=0; const now=new Date().toISOString();
    for(const d of news){ try{ d.createdAt=d.updatedAt=now; d.createdBy=d.updatedBy=S.me.id||null; const ref=db.collection('dossiers').doc(); await ref.set(d);
      await db.collection('historique').add({dossierId:ref.id,at:now,by:S.me.id||null,type:'import',changes:[]}); ok++; b.textContent=`Import… ${ok}/${news.length}`; }catch(err){ msg.textContent=`Arrêt après ${ok} dossier(s) : `+(err.message||err.code); break; } }
    toast(`${ok} dossier(s) importé(s)`); out.innerHTML=''; msg.textContent=`${ok} dossier(s) importé(s).`; });
}

async function init(){
  const h=(location.hash||'').slice(1); if(VIEWS.some(([k])=>k===h)||h==='plus') S.view=h;
  renderNav(); renderView();
  if(!window.claude?.use){ S.conn='off'; renderBanner(); return; }
  [db,userNs]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db){ S.conn='off'; renderBanner(); return; }
  S.conn='on';
  if(userNs){ const m=await userNs.me(); S.me={id:m.id,name:m.name,regie:m.regie||''}; if(S.me.regie && !VIEWS_R.some(([k])=>k===S.view)) S.view='dashboard'; renderNav(); renderView(); const c=await userNs.can('data.write'); if(c===false) S.canWrite=false; }
  const err=e=>{ if(e?.code==='revoked'){ S.conn='off'; renderBanner(); } };
  db.collection('dossiers').onSnapshot(s=>{ S.dossiers=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})); S.loaded=true; refresh(); },err);
  db.doc('config/main').onSnapshot(s=>{ if(s.exists) S.cfg=mergeCfg(s.data()); refresh(); },err);
  db.collection('paiements').onSnapshot(s=>{ S.paiements=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})); refresh(); },err);
  db.collection('frais').onSnapshot(s=>{ S.fraisDivers=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})); refresh(); },err);
  db.collection('stock').onSnapshot(s=>{ S.stock=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})); refresh(); },err);
  db.collection('documents').onSnapshot(s=>{ S.documents=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})); refresh(); if(cur?.id && !$('#doc-file')?.disabled) renderDocs(cur.id); },err);
  db.collection('sav').onSnapshot(s=>{ S.sav=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})); refresh(); },err);
  db.collection('rappels').onSnapshot(s=>{ S.rappels=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})); refresh(); },err);
  let first=true;
  db.collection('membres').onSnapshot(s=>{ S.membres=Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); refresh(); if(first){ first=false; setTimeout(askName,400); } },err);
}
init();
</script>
