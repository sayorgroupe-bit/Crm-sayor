<script>
/* Affiche à l'écran toute erreur du CRM (diagnostic sur iPad) */
(function(){ function show(m){ try{ var b=document.getElementById('crm-err'); if(!b){ b=document.createElement('div'); b.id='crm-err'; b.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#B4232A;color:#fff;font:13px/1.4 -apple-system,sans-serif;padding:10px 12px;border-radius:10px;white-space:pre-wrap;max-height:40vh;overflow:auto'; (document.body||document.documentElement).appendChild(b); } b.textContent+=(b.textContent?'\n':'')+'Erreur CRM : '+m; }catch(e){} }
  window.addEventListener('error',function(e){ var t=''; try{ var sc=document.getElementsByTagName('script'); for(var k=0;k<sc.length;k++){ var L=(sc[k].textContent||'').split('\n'); if(e.lineno && L.length>=e.lineno && L.length>50){ t+='\n['+k+'] '+L[e.lineno-1].trim().slice(0,220); } } }catch(x){} show((e.message||'erreur')+' (ligne '+(e.lineno||'?')+')'+t); });
  window.addEventListener('unhandledrejection',function(e){ var r=e.reason; show('promesse : '+((r&&(r.message||r.code))||r)); });
})();
</script>

<base target="_top">
<meta charset="utf-8">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#F2F5F8}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>CRM Sayor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout : barre latérale sur ordinateur, barre d'onglets en bas sur iPhone/iPad portrait ; fiches dossier en panneau plein écran */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#EAF0F5; --line:#DCE3EA; --fg:#14212D; --muted:#5B6B7B;
  --accent:#0E6A87; --accent-fg:#FFFFFF; --accent-soft:#DDEFF5;
  --ok:#1E8A57; --warn:#B9770B; --bad:#C23A2B;
  --cee-bleu:#2563EB; --cee-jaune:#D4A10C; --cee-violet:#7C4DDB; --cee-rose:#D9468C;
  --s-nrp:#9F3A5A; --s-adocs:#B45309; --s-drecus:#0F766E;
  --s-attente:#64748B; --s-envoye:#0284C7; --s-signe:#4F46E5; --s-aconf:#C27C0E; --s-conf:#0D9488;
  --s-placer:#EA6A0C; --s-fixee:#8B3FD9; --s-installe:#1E8A57; --s-annule:#B4232A;
  --shadow:0 1px 2px rgba(20,33,45,.06),0 4px 14px rgba(20,33,45,.05);
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --surface:#141C25; --surface-2:#1A2430; --line:#26323F; --fg:#E5ECF2; --muted:#92A2B2;
  --accent:#3AA8CA; --accent-fg:#06202A; --accent-soft:#12303B;
  --ok:#3CC283; --warn:#E6A93A; --bad:#EF6B5C;
  --cee-bleu:#5B8DF5; --cee-jaune:#E8C13F; --cee-violet:#A07CF0; --cee-rose:#EC72AD;
  --s-nrp:#E27A9C; --s-adocs:#F0A24E; --s-drecus:#34C9B8;
  --s-attente:#94A3B8; --s-envoye:#38B2EA; --s-signe:#8A85F5; --s-aconf:#E6A93A; --s-conf:#2DC5B5;
  --s-placer:#F48E45; --s-fixee:#B07CF0; --s-installe:#3CC283; --s-annule:#EF6B5C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#141C25; --surface-2:#1A2430; --line:#26323F; --fg:#E5ECF2; --muted:#92A2B2;
  --accent:#3AA8CA; --accent-fg:#06202A; --accent-soft:#12303B;
  --ok:#3CC283; --warn:#E6A93A; --bad:#EF6B5C;
  --cee-bleu:#5B8DF5; --cee-jaune:#E8C13F; --cee-violet:#A07CF0; --cee-rose:#EC72AD;
  --s-nrp:#E27A9C; --s-adocs:#F0A24E; --s-drecus:#34C9B8;
  --s-attente:#94A3B8; --s-envoye:#38B2EA; --s-signe:#8A85F5; --s-aconf:#E6A93A; --s-conf:#2DC5B5;
  --s-placer:#F48E45; --s-fixee:#B07CF0; --s-installe:#3CC283; --s-annule:#EF6B5C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1.08rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:flex;min-height:100%}
.side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.brand b{font-family:var(--f-display);font-size:1.02rem;display:block}
.brand span{font-size:.75rem;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;background:none;border-radius:9px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav-btn svg{width:19px;height:19px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-count{margin-left:auto;font-size:.72rem;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
main{flex:1;min-width:0;padding:22px 28px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin-right:auto}
.tabbar{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.82rem}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:17px;height:17px}

/* cards / panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h2{margin-right:auto}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:1.55rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:.8rem;color:var(--muted)}
.cols-2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}

.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.money>div{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.money>div:last-child{border-right:0}
.money .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:6px}
.money .big{font-family:var(--f-display);font-size:1.3rem;font-weight:600}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* badges */
.badge{--c:var(--s-attente);display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:.76rem;font-weight:600;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;background:var(--line);flex:none}
.chipcat{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;white-space:nowrap}
.paid{color:var(--ok);font-weight:600}

/* stacked status bar */
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:12px}
.legend button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px 4px 8px;display:inline-flex;gap:7px;align-items:center;font-size:.8rem;cursor:pointer}
.legend button b{font-variant-numeric:tabular-nums}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.li:first-child{border-top:0}
.li:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-tile{width:46px;flex:none;text-align:center;border-radius:9px;background:var(--surface-2);padding:5px 0;line-height:1.1}
.date-tile b{display:block;font-family:var(--f-display);font-size:1.1rem}
.date-tile span{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}

/* dossiers table */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;padding:10px 12px 10px 38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:42px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
select.inp,input.inp,textarea.inp{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);min-height:42px}
textarea.inp{min-height:80px;resize:vertical}
.toolbar select.inp{width:auto;min-width:150px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.82rem;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip b{font-variant-numeric:tabular-nums;opacity:.75}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
td.r,th.r{text-align:right}
.client-cell b{display:block}
.neg{color:var(--bad)}
.pos{color:var(--ok)}
.cards{display:none}

/* planning */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .hd{background:var(--surface-2);padding:7px 8px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.cal .day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0;border:0;text-align:left}
.cal .day.out{background:var(--bg)}
.cal .day.out .n{opacity:.45}
.cal .day .n{font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.cal .day.today .n{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:0 7px;align-self:flex-start}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ev{--c:var(--accent);font-size:.74rem;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-dots{display:none;gap:3px;flex-wrap:wrap}
.ev-dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.more{font-size:.72rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.week-day{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.week-day:first-child{border-top:0}
.pose-card{--c:var(--accent);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:9px;padding:9px 12px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.pose-card .t{font-weight:600}

/* sheet (fiche dossier) */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,18,26,.45);display:flex;justify-content:flex-end}
.sheet-in{background:var(--bg);width:min(860px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.18)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet-head h2{margin-right:auto;font-size:1.15rem;min-width:0}
.sheet-body{flex:1;overflow:auto;padding:18px 20px 30px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:10px;align-items:center;padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-foot .msg{margin-right:auto;font-size:.85rem}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px 16px;margin:0;min-width:0}
legend{font-family:var(--f-display);font-weight:600;font-size:.95rem;padding:0 6px;margin-left:-6px}
.fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:.78rem;color:var(--muted);font-weight:600}
.f.c2{grid-column:span 2}
.f.c4{grid-column:1/-1}
.hint{font-size:.78rem;color:var(--muted)}
.calc{font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:11px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.toggle label{padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted)}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle label:has(input:checked){background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.sel-add{display:flex;gap:6px}
.sel-add select{flex:1;min-width:0}
.sel-add .btn{min-width:42px;padding:0 10px}
.addrow{display:flex;gap:6px;margin-top:6px}
.addrow input{flex:1;min-width:0}
.colorpick{display:flex;gap:6px;flex-wrap:wrap}
.colorpick label{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:.85rem;font-weight:600;background:var(--surface)}
.colorpick input{position:absolute;opacity:0;pointer-events:none}
.colorpick label:has(input:checked){border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.summary>div{background:var(--surface);padding:11px 14px;min-width:0}
.summary b{display:block;font-family:var(--f-display);font-size:1.12rem;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column;gap:0}
.hist .h{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hist .h:first-child{border-top:0}
.hist .h ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.hist .h li{font-size:.86rem}
.arrow{color:var(--muted);padding:0 4px}

/* entity cards (fournisseurs, poseurs, commerciaux) */
.ent{display:flex;flex-direction:column;gap:12px}
.ent-figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ent-figs div{background:var(--surface-2);border-radius:9px;padding:9px 11px;min-width:0}
.ent-figs b{display:block;font-family:var(--f-display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.pay-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:end}
.pays{display:flex;flex-direction:column}
.pay{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line);font-size:.86rem}
.pay:first-child{border-top:0}
.pay .grow{flex:1;min-width:0}
details summary{cursor:pointer;font-size:.85rem;color:var(--accent);font-weight:600}
details .list{margin-top:6px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.dchip.ok{border-color:color-mix(in srgb,var(--s-installe) 45%,transparent);background:color-mix(in srgb,var(--s-installe) 12%,transparent);color:var(--s-installe)}
.dic{flex:none;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:.66rem;font-weight:800;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent)}
.doc-up{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}.doc-up select{flex:1 1 180px;width:auto}
#docview{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dv-head{display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface,var(--bg))}
.dv-head a.btn{text-decoration:none}
.dv-body{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;-webkit-overflow-scrolling:touch}
.dv-body img,.dv-body canvas{max-width:100%;height:auto;box-shadow:0 1px 6px rgba(0,0,0,.18);background:#fff}
.tag{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.04em}

/* misc */

<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>
<button class="fab" id="fab" aria-label="Nouveau dossier" hidden></button>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ====== CRM Sayor — connexion au site (identifiant / mot de passe) et données Google Sheet ====== */
(function () {
  var TK = 'sayor_token';
  var token = null;
  try { token = localStorage.getItem(TK) || sessionStorage.getItem(TK); } catch (e) {}
  var me = null, users = [];
  var store = {};            // collection -> { id: data }
  var rev = 0;
  var colListeners = [];     // { col, fn, err }
  var docListeners = [];     // { col, id, fn }
  var readyResolve, ready = new Promise(function (r) { readyResolve = r; });

  function saveToken(t) {
    token = t;
    try { if (t) localStorage.setItem(TK, t); else localStorage.removeItem(TK); } catch (e) {}
    try { if (t) sessionStorage.setItem(TK, t); else sessionStorage.removeItem(TK); } catch (e) {}
  }
  function run(fn, args) {
    if (window.google && google.script && google.script.run) {
      return new Promise(function (res, rej) {
        var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(new Error(String(e && e.message || e))); });
        r[fn].apply(r, args);
      });
    }
    if (!window.SAYOR_API) return Promise.reject(new Error('Serveur indisponible'));
    return fetch(window.SAYOR_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error('Serveur indisponible (' + r.status + ')'); return r.json(); });
  }
  window.SAYOR_RUN = run;
  function call(action, payload) {
    return new Promise(function (res, rej) {
      run('api', [token, action, payload || {}]).then(function (r) {
        if (r && r.error) {
          if (r.code === 'auth') { saveToken(null); location.reload(); }
          rej({ code: r.code === 'auth' ? 'revoked' : 'invalid_argument', message: r.error });
        } else res(r || {});
      }, function (e) { rej({ code: 'unavailable', message: String(e && e.message || e) }); });
    });
  }
  var clone = function (o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); };
  var newId = function () { var c = 'abcdefghijklmnopqrstuvwxyz0123456789', s = ''; for (var i = 0; i < 20; i++) s += c[Math.floor(Math.random() * c.length)]; return s; };
  function mergeDeep(a, b) {
    Object.keys(b).forEach(function (k) {
      var v = b[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && v.__delete__ === true) { delete a[k]; return; }
      if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) mergeDeep(a[k], v);
      else a[k] = clone(v);
    });
    return a;
  }

  /* ---------- snapshots ---------- */
  var META = { fromCache: false, hasPendingWrites: false };
  function docSnap(col, id) {
    var d = store[col] && store[col][id];
    return { id: id, exists: !!d, data: function () { return d ? clone(d) : undefined; }, metadata: META };
  }
  function querySnap(col, filters) {
    var m = store[col] || {};
    var docs = Object.keys(m).filter(function (id) {
      return (filters || []).every(function (f) {
        var v = m[id][f[0]];
        switch (f[1]) {
          case '==': return v === f[2]; case '!=': return v !== f[2];
          case '<': return v < f[2]; case '<=': return v <= f[2]; case '>': return v > f[2]; case '>=': return v >= f[2];
          case 'in': return (f[2] || []).indexOf(v) > -1; case 'not-in': return (f[2] || []).indexOf(v) < 0;
          case 'array-contains': return Array.isArray(v) && v.indexOf(f[2]) > -1;
        }
        return true;
      });
    }).sort().map(function (id) { return docSnap(col, id); });
    return { docs: docs, size: docs.length, empty: !docs.length, docChanges: function () { return []; }, metadata: META };
  }
  function emit(cols) {
    colListeners.forEach(function (l) { if (!cols || cols[l.col]) { try { l.fn(querySnap(l.col, l.filters)); } catch (e) { console.error(e); } } });
    docListeners.forEach(function (l) { if (!cols || cols[l.col]) { try { l.fn(docSnap(l.col, l.id)); } catch (e) { console.error(e); } } });
  }
  function loadAll() {
    return call('all').then(function (r) {
      store = {};
      Object.keys(r.docs || {}).forEach(function (c) { store[c] = {}; r.docs[c].forEach(function (d) { store[c][d.id] = d.data; }); });
      users = r.users || users; rev = r.rev; emit(null);
    });
  }
  var writing = 0;
  function write(ops) {
    // application immédiate à l'écran, puis enregistrement dans le Google Sheet
    var cols = {};
    ops.forEach(function (o) {
      cols[o.col] = 1; store[o.col] = store[o.col] || {};
      if (o.op === 'delete') delete store[o.col][o.id];
      else if (o.op === 'update') { if (!store[o.col][o.id]) throw { code: 'invalid_argument', message: 'Document introuvable' }; mergeDeep(store[o.col][o.id], o.data); }
      else store[o.col][o.id] = clone(o.data);
    });
    emit(cols);
    writing++;
    return call('write', { ops: ops }).then(function (r) { rev = r.rev; writing--; }, function (e) { writing--; loadAll().catch(function () {}); throw e; });
  }
  setInterval(function () {
    if (!me || writing || document.hidden) return;
    call('rev').then(function (r) { if (r.rev !== rev) return loadAll(); }).catch(function () {});
  }, 12000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && me && !writing) loadAll().catch(function () {}); });

  /* ---------- API compatible avec le CRM ---------- */
  function docRef(col, id) {
    return {
      id: id, path: col + '/' + id,
      get: function () { return Promise.resolve(docSnap(col, id)); },
      set: function (d) { return write([{ op: 'set', col: col, id: id, data: clone(d) }]); },
      update: function (d) { return write([{ op: 'update', col: col, id: id, data: clone(d) }]); },
      delete: function () { return write([{ op: 'delete', col: col, id: id }]); },
      onSnapshot: function (fn) { var l = { col: col, id: id, fn: fn }; docListeners.push(l); setTimeout(function () { fn(docSnap(col, id)); }, 0); return function () { docListeners = docListeners.filter(function (x) { return x !== l; }); }; },
      collection: function (sub) { return colRef(col + '/' + id + '/' + sub); }
    };
  }
  function query(col, filters) {
    return {
      where: function (f, op, v) { return query(col, (filters || []).concat([[f, op, v]])); },
      orderBy: function () { return query(col, filters); },
      limit: function () { return query(col, filters); },
      get: function () { return Promise.resolve(querySnap(col, filters)); },
      onSnapshot: function (fn, err) { var l = { col: col, filters: filters, fn: fn, err: err }; colListeners.push(l); setTimeout(function () { fn(querySnap(col, filters)); }, 0); return function () { colListeners = colListeners.filter(function (x) { return x !== l; }); }; }
    };
  }
  function colRef(col) {
    var q = query(col, []);
    q.path = col;
    q.doc = function (id) { return docRef(col, id || newId()); };
    q.add = function (d) { var id = newId(); return write([{ op: 'set', col: col, id: id, data: clone(d) }]).then(function () { return docRef(col, id); }); };
    return q;
  }
  var db = {
    collection: function (p) { return colRef(p); },
    doc: function (p) { var i = p.lastIndexOf('/'); return docRef(p.slice(0, i), p.slice(i + 1)); }
  };
  var userNs = {
    isOwner: function () { return Promise.resolve(!!(me && me.admin)); },
    canEdit: function () { return Promise.resolve(true); },
    can: function () { return Promise.resolve(true); },
    id: function () { return Promise.resolve(me && me.id); },
    name: function () { return Promise.resolve(me ? me.nom : ''); },
    me: function () { return Promise.resolve({ id: me && me.id, name: me ? me.nom : '', regie: (me && me.regie) || '', email: null, isOwner: !!(me && me.admin), canEdit: true, avatarUrl: '', color: '#0E6A87' }); },
    profiles: function (ids) {
      var out = {}; [].concat(ids).forEach(function (id) { var u = users.filter(function (x) { return x.id === id; })[0]; out[id] = { id: id, name: u ? u.nom : '', avatarUrl: '', color: '#0E6A87', email: null, isMe: !!(me && id === me.id), guest: false }; });
      return Promise.resolve(out);
    },
    search: function () { return Promise.resolve([]); }
  };
  window.claude = { use: function (n) { return ready.then(function () { return n === 'db' ? db : n === 'user' ? userNs : null; }); } };

  /* ---------- écran de connexion ---------- */
  var css = '.lg-wrap{position:fixed;inset:0;z-index:200;background:var(--bg,#F2F5F8);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}'
    + '.lg-card{width:min(400px,100%);background:var(--surface,#fff);border:1px solid var(--line,#DCE3EA);border-radius:16px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(20,33,45,.08)}'
    + '.lg-brand{display:flex;align-items:center;gap:12px;margin-bottom:4px}.lg-brand b{font-family:var(--f-display);font-size:1.15rem;display:block}.lg-brand span{font-size:.8rem;color:var(--muted,#5B6B7B)}'
    + '.lg-msg{font-size:.86rem;min-height:1.2em}.lg-msg.err{color:var(--bad,#C23A2B)}';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function showLogin(firstSetup) {
    var w = document.createElement('div'); w.className = 'lg-wrap';
    w.innerHTML = '<form class="lg-card" id="lg-form" autocomplete="on">'
      + '<div class="lg-brand"><div class="brand-mark">S</div><div><b>Sayor Groupe</b><span>' + (firstSetup ? 'Première connexion : créez le compte administrateur' : 'Espace équipe et partenaires') + '</span></div></div>'
      + (firstSetup ? '<div class="f"><label for="lg-nom">Votre nom</label><input class="inp" id="lg-nom" required placeholder="Ex. : ATTOUN"></div>' : '')
      + '<div class="f"><label for="lg-id">Identifiant</label><input class="inp" id="lg-id" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>'
      + '<div class="f"><label for="lg-pw">Mot de passe</label><input class="inp" id="lg-pw" type="password" required autocomplete="' + (firstSetup ? 'new-password' : 'current-password') + '"></div>'
      + (firstSetup ? '<div class="f"><label for="lg-pw2">Confirmez le mot de passe</label><input class="inp" id="lg-pw2" type="password" required autocomplete="new-password"></div>' : '')
      + '<div class="lg-msg" id="lg-msg"></div>'
      + '<button class="btn primary" type="submit" id="lg-btn">' + (firstSetup ? 'Créer le compte et entrer' : 'Se connecter') + '</button></form>';
    document.body.appendChild(w);
    var f = w.querySelector('#lg-form'), msg = w.querySelector('#lg-msg'), btn = w.querySelector('#lg-btn');
    setTimeout(function () { (w.querySelector('#lg-nom') || w.querySelector('#lg-id')).focus(); }, 50);
    f.addEventListener('submit', function (e) {
      e.preventDefault(); msg.className = 'lg-msg'; msg.textContent = '';
      var p = { identifiant: f.querySelector('#lg-id').value, password: f.querySelector('#lg-pw').value };
      if (firstSetup) {
        p.nom = f.querySelector('#lg-nom').value;
        if (p.password !== f.querySelector('#lg-pw2').value) { msg.className = 'lg-msg err'; msg.textContent = 'Les deux mots de passe ne sont pas identiques.'; return; }
      }
      btn.disabled = true; btn.textContent = 'Connexion…';
      call(firstSetup ? 'setup' : 'login', p).then(function (r) {
        saveToken(r.token); me = r.user; w.remove(); start();
      }, function (err) {
        btn.disabled = false; btn.textContent = firstSetup ? 'Créer le compte et entrer' : 'Se connecter';
        msg.className = 'lg-msg err'; msg.textContent = err.message || 'Connexion impossible.';
      });
    });
  }
  function start() {
    loadAll().then(function () { readyResolve(); }, function (e) { alertBanner('Impossible de charger les données : ' + (e.message || e.code)); readyResolve(); });
  }
  function alertBanner(t) { var b = document.getElementById('banner'); if (b) b.innerHTML = '<div class="banner">' + esc(t) + '</div>'; }
  function boot() {
    if (token) {
      call('me').then(function (r) { me = r.user; start(); }, function () { saveToken(null); call('status').then(function (s) { showLogin(!s.hasUsers); }); });
    } else {
      call('status').then(function (s) { showLogin(!s.hasUsers); }, function (e) { alertBanner('Serveur indisponible : ' + (e.message || '')); });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

  /* ---------- comptes d'accès (dans Paramètres) ---------- */
  window.SAYOR_SITE = {
    token: function () { return token; },
    renderAccounts: function (box, regies) {
      if (!box || !me) return; regies = regies || [];
      function draw(list) {
        box.innerHTML = '<div class="panel-head"><h2>Comptes d’accès au site</h2><button class="btn sm" type="button" id="acc-out">Se déconnecter</button></div>'
          + '<p class="small muted" style="margin-top:0">Connecté en tant que <b>' + esc(me.nom) + '</b> (' + esc(me.identifiant) + ')' + (me.admin ? ' · administrateur' : '') + '.</p>'
          + '<div class="list">' + list.map(function (u) { return '<div class="li" style="cursor:default"><div class="grow"><div class="t">' + esc(u.nom) + '</div><div class="small muted">Identifiant : ' + esc(u.identifiant) + (u.admin ? ' · administrateur' : '') + (u.regie ? ' · régie ' + esc(u.regie) : '') + '</div></div>'
            + (me.admin && u.id !== me.id ? '<button class="btn sm ghost" type="button" data-deluser="' + esc(u.id) + '">Supprimer</button>' : (u.id === me.id ? '<span class="tag">Vous</span>' : '')) + '</div>'; }).join('') + '</div>'
          + (me.admin ? '<form id="acc-add" class="fg" style="margin-top:14px"><div class="f"><label for="acc-nom">Nom</label><input class="inp" id="acc-nom" required placeholder="Ex. : EITHAN"></div>'
            + '<div class="f"><label for="acc-id">Identifiant</label><input class="inp" id="acc-id" required autocapitalize="none" autocorrect="off"></div>'
            + '<div class="f"><label for="acc-pw">Mot de passe (6 caractères min.)</label><input class="inp" id="acc-pw" required></div>'
            + '<div class="f"><label for="acc-role">Accès</label><select class="inp" id="acc-role"><option value="">Équipe Sayor</option><option value="admin">Équipe Sayor + administrateur</option>' + regies.map(function (r) { return '<option value="R:' + esc(r) + '">Régie ' + esc(r) + ' (ses dossiers seulement)</option>'; }).join('') + '</select></div>'
            + '<div class="f c4"><button class="btn primary" type="submit">Créer le compte</button><span class="small" id="acc-msg"></span></div></form>' : '')
          + '<form id="acc-pwd" class="fg" style="margin-top:14px"><div class="f"><label for="pw-old">Mot de passe actuel</label><input class="inp" type="password" id="pw-old" required autocomplete="current-password"></div>'
          + '<div class="f"><label for="pw-new">Nouveau mot de passe</label><input class="inp" type="password" id="pw-new" required autocomplete="new-password"></div>'
          + '<div class="f c2"><button class="btn" type="submit" style="margin-top:22px">Changer mon mot de passe</button><span class="small" id="pw-msg"></span></div></form>';
        box.querySelector('#acc-out').onclick = function () { call('logout').catch(function () {}); saveToken(null); location.reload(); };
        box.querySelectorAll('[data-deluser]').forEach(function (b) {
          b.onclick = function () {
            if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Confirmer'; b.classList.add('danger'); return; }
            call('delUser', { id: b.dataset.deluser }).then(load, function (e) { alert(e.message); });
          };
        });
        var add = box.querySelector('#acc-add');
        if (add) add.addEventListener('submit', function (e) {
          e.preventDefault(); var m = box.querySelector('#acc-msg'); m.textContent = 'Création…'; m.className = 'small muted';
          var role = add.querySelector('#acc-role').value;
          call('addUser', { nom: add.querySelector('#acc-nom').value, identifiant: add.querySelector('#acc-id').value, password: add.querySelector('#acc-pw').value, admin: role === 'admin', regie: role.indexOf('R:') === 0 ? role.slice(2) : '' })
            .then(function () { load(); }, function (err) { m.className = 'small neg'; m.textContent = err.message; });
        });
        var pw = box.querySelector('#acc-pwd');
        pw.addEventListener('submit', function (e) {
          e.preventDefault(); var m = box.querySelector('#pw-msg');
          call('password', { old: pw.querySelector('#pw-old').value, password: pw.querySelector('#pw-new').value })
            .then(function () { m.className = 'small pos'; m.textContent = 'Mot de passe changé.'; pw.reset(); }, function (err) { m.className = 'small neg'; m.textContent = err.message; });
        });
      }
      function load() { call('users').then(function (r) { users = r.users; draw(r.users); }, function () { draw(users); }); }
      draw(users); load();
    }
  };
})();

</script>
<script>
/* ============ Icônes ============ */
const I = {

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const eur = n => nf.format(Math.round(n||0))+' €';
const num = v => { if(v==null||v==='') return null; const n=Number(String(v).replace(/\s|€/g,'').replace(',','.')); return isFinite(n)?n:null; };
const n0 = v => Number(v)||0;
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = () => ymd(new Date());
const parseYmd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const fmtDate = (s,opt={day:'numeric',month:'long'}) => s? parseYmd(s).toLocaleDateString('fr-FR',opt):'';
const fmtDT = iso => { const d=new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} — ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const norm = s => String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();

const setP = (o,p,v) => { const ks=p.split('.'); let t=o; ks.slice(0,-1).forEach(k=>{ if(typeof t[k]!=='object'||!t[k]) t[k]={}; t=t[k]; }); t[ks.at(-1)]=v; };

/* ============ Calculs ============ */
const actif = d => d.statut!=='Annulé';
const ceeMontant = d => d.ceeReel!=null && d.ceeReel!=='' ? n0(d.ceeReel) : d.ceeCouleur ? n0(S.cfg.baremeCEE[d.ceeCouleur]) : 0;
const mprMontant = d => d.mprStatut==='Non concerné' ? 0 : d.mprReel!=null && d.mprReel!=='' ? n0(d.mprReel) : d.mprCouleur ? n0(S.cfg.baremeMPR[d.mprCouleur]) : 0;
const ceeEnc = d => d.ceeStatut==='Payé' ? ceeMontant(d) : 0;
const mprEnc = d => d.mprStatut==='Payé' ? mprMontant(d) : 0;
const racMontant = d => d.statut==='Annulé' ? 0 : n0(d.rac);
const racEnc = d => d.statut==='Annulé' ? 0 : Math.min(n0(d.racPaye), n0(d.rac) || n0(d.racPaye));
const fraisLies = d => S.fraisDivers.filter(f=>f.dossierId && f.dossierId===d.id).reduce((a,f)=>a+n0(f.montant),0);
const couleurDossier = d => d.ceeCouleur || d.mprCouleur || '';
const surcoms = d => d.apporteur2 && n0(d.commission2) ? [{beneficiaire:d.apporteur2, montant:n0(d.commission2)}] : [];
const surcomTotal = d => actif(d) ? surcoms(d).reduce((a,x)=>a+x.montant,0) : 0;
const couts = d => n0(d.materiel)+n0(d.pose)+n0(d.frais)+n0(d.bonusApporteur)+n0(d.commission)+surcomTotal(d)+regieCout(d)+(d.id?fraisLies(d):0);
const caPrev = d => actif(d) ? ceeMontant(d)+mprMontant(d)+racMontant(d) : 0;
const margePrev = d => caPrev(d) - (actif(d)?couts(d):0);

function totals(list=S.dossiers, global=(list===S.dossiers)){
  const t={ceeEnc:0,ceePrev:0,mprEnc:0,mprPrev:0,racEnc:0,racPrev:0,materiel:0,pose:0,frais:0,bonus:0,commission:0,divers:0,surcom:0,regie:0};
  list.filter(actif).forEach(d=>{ t.ceeEnc+=ceeEnc(d); t.ceePrev+=ceeMontant(d); t.mprEnc+=mprEnc(d); t.mprPrev+=mprMontant(d); t.racEnc+=racEnc(d); t.racPrev+=racMontant(d);
    t.materiel+=n0(d.materiel); t.pose+=n0(d.pose); t.frais+=n0(d.frais); t.bonus+=n0(d.bonusApporteur); t.commission+=n0(d.commission); t.surcom+=surcomTotal(d); t.regie+=regieCout(d); t.regieMPR=(t.regieMPR||0)+(d.regie?n0(d.regieMontantMPR):0); t.divers+=fraisLies(d); });
  if(global) t.divers+=S.fraisDivers.filter(f=>!f.dossierId || !S.dossiers.some(d=>d.id===f.dossierId)).reduce((a,f)=>a+n0(f.montant),0);
  t.enc=t.ceeEnc+t.mprEnc+t.racEnc; t.prev=t.ceePrev+t.mprPrev+t.racPrev;
  t.couts=t.materiel+t.pose+t.frais+t.bonus+t.commission+t.surcom+t.regie+t.divers;
  t.marge=t.prev-t.couts; t.margeEnc=t.enc-t.couts;
  t.margeCEE=t.ceePrev-(t.couts-t.bonus-(t.regieMPR||0));
  return t;
}
const paidTo = (type,nom) => S.paiements.filter(p=>p.type===type&&p.cible===nom).reduce((a,p)=>a+n0(p.montant),0);
function fournisseurStats(f){
  const ds=S.dossiers.filter(d=>actif(d)&&d.fournisseur===f.nom);
  const fr=S.fraisDivers.filter(x=>x.fournisseur===f.nom);
  const st=S.stock.filter(x=>x.fournisseur===f.nom);
  const du=ds.filter(d=>!d.stockId).reduce((a,d)=>a+n0(d.materiel),0)+fr.reduce((a,x)=>a+n0(x.montant),0)+st.reduce((a,x)=>a+n0(x.montant),0)+n0(f.ajustement); const paye=paidTo('fournisseur',f.nom);
  return {ds,fr,st,du,paye,reste:du-paye};
}
function poseurStats(p){
  const ds=S.dossiers.filter(d=>actif(d)&&d.poseur===p.nom);
  const du=ds.filter(d=>d.statut==='Installé').reduce((a,d)=>a+n0(d.pose),0);
  const avenir=ds.filter(d=>d.statut!=='Installé').reduce((a,d)=>a+n0(d.pose),0);
  const paye=paidTo('poseur',p.nom); return {ds,du,avenir,paye,reste:du-paye};
}
function commercialStats(c){
  const ds=S.dossiers.filter(d=>actif(d)&&d.commercial===c.nom);
  let acquis=0, engage=0;
  ds.forEach(d=>{ engage+=n0(d.commission)+n0(d.bonusApporteur);
    if(d.statut==='Installé') acquis+=n0(d.commission);
    if(d.mprStatut==='Payé') acquis+=n0(d.bonusApporteur); });
  // commissions comme apporteur supplémentaire sur d'autres dossiers
  const sur=[]; S.dossiers.filter(actif).forEach(d=>surcoms(d).forEach(x=>{ if(x.beneficiaire===c.nom){ sur.push({d,montant:x.montant}); engage+=x.montant; if(d.statut==='Installé') acquis+=x.montant; } }));
  const pays=S.paiements.filter(p=>p.type==='commercial'&&p.cible===c.nom);
  const paye=pays.reduce((a,p)=>a+n0(p.montant),0); const avances=pays.filter(p=>p.avance).reduce((a,p)=>a+n0(p.montant),0);
  return {ds,sur,acquis,engage,paye,avances,reste:acquis-paye};
}

function monthChart(){
  const now=new Date(); const months=[];
  for(let i=-8;i<=3;i++){ const d=new Date(now.getFullYear(),now.getMonth()+i,1); months.push({k:`${d.getFullYear()}-${pad(d.getMonth()+1)}`,l:d.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''),cur:i===0}); }
  months.forEach(m=>{ const ds=S.dossiers.filter(d=>actif(d)&&d.datePose?.startsWith(m.k)); m.inst=ds.filter(d=>d.statut==='Installé').length; m.plan=ds.length-m.inst; });
  const max=Math.max(4,...months.map(m=>m.inst+m.plan)); const W=720,H=200,pl=28,pb=26,pt=14,bw=(W-pl)/months.length;
  const y=v=>pt+(H-pt-pb)*(1-v/max); const ticks=[0,Math.round(max/2),max];
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Poses par mois">`;
  ticks.forEach(tk=>{ s+=`<line x1="${pl}" x2="${W}" y1="${y(tk)}" y2="${y(tk)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(tk)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${tk}</text>`; });
  months.forEach((m,i)=>{ const x=pl+i*bw+bw*.22, w=bw*.56;
    if(m.inst) s+=`<rect x="${x}" y="${y(m.inst)}" width="${w}" height="${y(0)-y(m.inst)}" rx="3" fill="var(--s-installe)"/>`;
    if(m.plan) s+=`<rect x="${x}" y="${y(m.inst+m.plan)}" width="${w}" height="${y(m.inst)-y(m.inst+m.plan)}" rx="3" fill="var(--s-fixee)" opacity=".85"/>`;
    const tot=m.inst+m.plan; if(tot) s+=`<text x="${x+w/2}" y="${y(tot)-5}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fg)">${tot}</text>`;
    s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${m.cur?'var(--accent)':'var(--muted)'}" font-weight="${m.cur?700:400}">${m.l}</text>`; });
  s+='</svg>';
  return s+`<div class="legend" style="margin-top:6px"><span class="chipcat"><span class="dot" style="background:var(--s-installe)"></span>Installés</span><span class="chipcat"><span class="dot" style="background:var(--s-fixee)"></span>Prévus</span></div>`;
}

const ceeDu = d => ceeMontant(d)>0 && d.ceeStatut!=='Payé';

}

  updCalc();
  if(d){ loadHistory(d.id); renderDocs(d.id); }

function addRef(what,val){ const C=S.cfg;
  if(what==='commercial' && !C.commerciaux.some(c=>c.nom===val)) C.commerciaux.push({nom:val,parDossier:0,bonusMPR:0});
  if(what==='fournisseur' && !C.fournisseurs.some(c=>c.nom===val)) C.fournisseurs.push({nom:val,ajustement:0});
  if(what==='poseur' && !C.poseurs.some(c=>c.nom===val)) C.poseurs.push({nom:val});
  if(what==='regie' && !C.regies.some(c=>c.nom===val)) C.regies.push({nom:val,parDossier:0});
  if(what==='typeFrais' && !C.typesFrais.includes(val)) C.typesFrais.splice(Math.max(C.typesFrais.length-1,0),0,val);
  if(what==='marque' && !C.marques.includes(val)) C.marques.splice(Math.max(C.marques.length-1,0),0,val);
  saveCfg(); }
function readForm(){
  const form=$('#dform'); const o=JSON.parse(JSON.stringify(cur.orig));
  o.occupant=form.occupant.value; o.ceeCouleur=form.ceeCouleur.value; o.mprCouleur=form.mprCouleur.value;
  $$('[data-f]',form).forEach(el=>{ const f=el.dataset.f; let v=el.value; v = NUM_FIELDS.has(f)? num(v) : v.trim(); setP(o,f,v); });
  if(o.client.nom) o.client.nom=o.client.nom.toUpperCase();
  if(o.proprietaire?.nom) o.proprietaire.nom=o.proprietaire.nom.toUpperCase();
  return o;
}
function updCalc(){
  const o=readForm();
  $('#cee-calc').innerHTML = (o.ceeCouleur||o.ceeReel!=null)? `${dotC(o.ceeCouleur)} ${o.ceeReel!=null?'Montant réel':'Barème'} : ${eur(ceeMontant(o))} ${o.ceeStatut==='Payé'?'<span class="paid">· encaissé</span>':'<span class="muted">· prévisionnel</span>'}`:'<span class="muted">Choisissez une couleur</span>';
  $('#mpr-calc').innerHTML = (o.mprCouleur||o.mprReel!=null)? `${dotC(o.mprCouleur)} ${o.mprReel!=null?'Montant réel':'Barème'} : ${eur(mprMontant(o))} ${o.mprStatut==='Payé'?'<span class="paid">· encaissé</span>':'<span class="muted">· prévisionnel</span>'}`:'<span class="muted">Choisissez une couleur</span>';
  const rc=$('#rac-calc'); if(rc){ const r=n0(o.rac), p=n0(o.racPaye); rc.innerHTML = r ? (p>=r ? '<span class="paid">Reste à charge soldé</span>' : `Reste à encaisser : <b>${eur(r-p)}</b>`) : ''; }
  const sum=$('#sum'); if(sum){ const ca=caPrev(o), cs=couts(o), enc=ceeEnc(o)+mprEnc(o)+racEnc(o);
    sum.innerHTML=`<div><span class="label">CA prévu</span><b>${eur(ca)}</b></div><div><span class="label">Encaissé</span><b class="${enc?'pos':''}">${eur(enc)}</b></div><div><span class="label">Coûts</span><b>${eur(cs)}</b></div><div><span class="label">Marge</span><b class="${ca-cs<0?'neg':''}">${eur(ca-cs)}</b></div>`; }
}
const show = (f,v) => { if(v==null||v==='') return 'vide'; if(NUM_FIELDS.has(f)) return eur(v); if(f==='datePose') return fmtDate(v,{day:'2-digit',month:'2-digit',year:'numeric'}); if(f==='occupant') return v==='locataire'?'Locataire':'Propriétaire-occupant'; if(f==='stockId'){ const x=S.stock.find(i=>i.id===v); return x?stockLib(x):'matériel du stock'; } return String(v); };
function diff(a,b){ const out=[]; for(const f of Object.keys(LABELS)){ const x=getP(a,f), y=getP(b,f); if((x??'')!==(y??'')) out.push({champ:f,avant:x??null,apres:y??null}); } return out; }

async function saveDossier(){
  if(saveDossier.busy) return;
  if(!db){ $('#sh-msg').textContent='Base de données indisponible : le dossier n’a pas été enregistré.'; return; }
  const btn=$('#sh-save'); const msg=$('#sh-msg');
  const o=readForm();
  if(!o.client.nom){ msg.textContent='Indiquez au moins le nom du client.'; msg.className='msg neg'; $('#f-client-nom').focus(); return; }
  if(o.datePose && ['En attente','NRP','Attente docs','Docs reçus','Devis envoyé','Devis signé','À confirmer','Confirmé','Pose à placer'].includes(o.statut) && !cur.orig.datePose) o.statut='Pose fixée';
  if(o.occupant!=='locataire') o.proprietaire={};
  const now=new Date().toISOString();
  const toStock = !!$('#f-tostock')?.checked;
  const changes = cur.id? diff(cur.orig,o) : [];
  if(cur.id && !changes.length && !toStock){ closeSheet(); return; }
  o.updatedAt=now; o.updatedBy=S.me.id||null;
  if(!cur.id){ o.createdAt=now; o.createdBy=S.me.id||null; }
  delete o.id;
  btn.disabled=true; saveDossier.busy=true; msg.className='msg muted'; msg.textContent='Enregistrement…';
  try{
    const ref = cur.id? db.collection('dossiers').doc(cur.id) : db.collection('dossiers').doc();
    await ref.set(o);
    try{ await syncStock(ref.id, cur.orig, o, toStock); }catch(e){ toast('Stock non mis à jour : '+(e.message||e.code)); }
    try{ await db.collection('historique').add({dossierId:ref.id, at:now, by:S.me.id||null, type:cur.id?'modif':'creation', changes:changes.map(c=>({...c, label:LABELS[c.champ]}))}); }catch(e){}
    saveDossier.busy=false;
    toast(cur.id?'Modifications enregistrées':'Dossier créé et enregistré');
    closeSheet();
  }catch(e){
    saveDossier.busy=false; btn.disabled=false; msg.className='msg neg';
    msg.textContent = e.code==='invalid_argument' ? 'Enregistrement refusé : vous n’avez pas les droits d’écriture sur ce CRM.' : 'Enregistrement impossible ('+(e.message||e.code)+'). Vos saisies sont conservées, réessayez.';
  }
}
function closeSheet(){ $('#sheet').hidden=true; $('#sheet').innerHTML=''; document.body.style.overflow=''; cur=null; if(pending){ pending=false; } renderView(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

async function loadHistory(id){
  const box=$('#hist'); if(!box||!db) return;
  try{
    const snap=await db.collection('historique').where('dossierId','==',id).get();
    const hs=snap.docs.map(d=>d.data()).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
    await resolveNames(hs.map(h=>h.by));
    if(!$('#hist')) return;
    box.innerHTML = hs.length? hs.map(h=>`<div class="h"><div class="small"><b class="num">${fmtDT(h.at)}</b><div class="muted">${esc(nameOf(h.by))}</div></div>
      <ul>${h.type==='creation'?'<li>Dossier créé</li>':h.type==='import'?'<li>Dossier importé depuis le Google Sheet</li>':(h.changes||[]).map(c=>`<li>${esc(c.label||LABELS[c.champ]||c.champ)} modifié : « ${esc(show(c.champ,c.avant))} »<span class="arrow">→</span>« ${esc(show(c.champ,c.apres))} »</li>`).join('')}</ul></div>`).join('')
      : '<div class="muted small">Aucune modification enregistrée pour l’instant.</div>';
  }catch(e){ box.innerHTML='<div class="muted small">Historique indisponible.</div>'; }
}
async function resolveNames(ids){ ids=[...new Set(ids.filter(Boolean))].filter(i=>!S.membres[i]?.nom && !S.profiles[i]); if(!ids.length||!userNs) return;
  try{ const ps=await userNs.profiles(ids); for(const i in ps) if(ps[i].name) S.profiles[i]=ps[i].name; }catch(e){} }

function vPlanning(v){
  const C=S.cal, act=S.dossiers.filter(actif);
  const dated=act.filter(d=>d.datePose); const aPlan=act.filter(d=>!d.datePose && d.statut!=='Installé');
  const ref=C.ref; let title, body;
  if(C.mode==='mois'){
    title=ref.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    const first=new Date(ref.getFullYear(),ref.getMonth(),1); const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
    let cells=''; const today=TODAY();
    for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const k=ymd(d); const evs=dated.filter(x=>x.datePose===k);
      if(i===35 && d.getMonth()!==ref.getMonth()) break;
      cells+=`<button type="button" class="day ${d.getMonth()!==ref.getMonth()?'out':''} ${k===today?'today':''} ${k===C.sel?'sel':''}" data-day="${k}" aria-label="${fmtDate(k)}, ${evs.length} pose(s)"><span class="n">${d.getDate()}</span>
        ${evs.slice(0,3).map(x=>`<span class="ev" style="--c:${poseurColor(x.poseur)}">${esc(x.client?.nom||'')}${x.poseur?' · '+esc(x.poseur):''}</span>`).join('')}${evs.length>3?`<span class="more">+${evs.length-3} autre(s)</span>`:''}
        <span class="ev-dots">${evs.map(x=>`<i style="--c:${poseurColor(x.poseur)}"></i>`).join('')}</span></button>`; }
    const selEvs=dated.filter(x=>x.datePose===C.sel);
    body=`<div class="cal">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(j=>`<div class="hd">${j}</div>`).join('')}${cells}</div>
      <div class="panel" style="margin-top:14px"><div class="panel-head"><h2>${fmtDate(C.sel,{weekday:'long',day:'numeric',month:'long'})}</h2><span class="small muted">${selEvs.length} pose(s)</span></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px">${selEvs.map(poseCard).join('')||'<div class="muted small">Aucune pose ce jour-là.</div>'}</div></div>`;
  } else {
    const start=new Date(ref); start.setDate(ref.getDate()-((ref.getDay()+6)%7)); const end=new Date(start); end.setDate(start.getDate()+6);
    title=`Semaine du ${start.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}`;
    let rows=''; for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const k=ymd(d); const evs=dated.filter(x=>x.datePose===k);
      rows+=`<div class="week-day"><div class="date-tile" style="${k===TODAY()?'background:var(--accent);color:var(--accent-fg)':''}"><b>${d.getDate()}</b><span style="color:inherit">${d.toLocaleDateString('fr-FR',{weekday:'short'})}</span></div>
        <div class="grid" style="flex:1;min-width:0;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px">${evs.map(poseCard).join('')||'<span class="muted small" style="align-self:center">—</span>'}</div></div>`; }
    body=`<div class="panel">${rows}</div>`;
  }
  const poseursUsed=S.cfg.poseurs.filter(p=>dated.some(d=>d.poseur===p.nom));
  v.innerHTML = topBar('Planning')+`
  <div class="toolbar"><div class="seg" role="group" aria-label="Vue"><button data-mode="mois" aria-pressed="${C.mode==='mois'}">Mois</button><button data-mode="semaine" aria-pressed="${C.mode==='semaine'}">Semaine</button></div>
    <div style="display:flex;align-items:center;gap:6px;margin-left:auto"><button class="btn sm" id="cal-prev" aria-label="Précédent">${ic('left')}</button><button class="btn sm" id="cal-today">Aujourd’hui</button><button class="btn sm" id="cal-next" aria-label="Suivant">${ic('right')}</button></div></div>
  <h2 style="text-transform:capitalize;margin-bottom:10px">${title}</h2>
  ${body}
  ${poseursUsed.length?`<div class="legend">${poseursUsed.map(p=>`<span class="chipcat"><span class="dot" style="background:${poseurColor(p.nom)}"></span>${esc(p.nom)}</span>`).join('')}</div>`:''}
  <div class="panel" style="margin-top:14px"><div class="panel-head"><h2>À planifier</h2><span class="small muted">${aPlan.length} dossier(s) sans date de pose</span></div>
    <div class="list">${aPlan.map(d=>`<div class="li" data-open="${d.id}"><div class="grow"><div class="t">${esc(fullName(d))}</div><div class="small muted">${esc(d.client?.ville||'')}${d.commercial?' · '+esc(d.commercial):''}${d.poseur?' · Poseur : '+esc(d.poseur):''}</div></div>${badge(d.statut)}</div>`).join('')||'<div class="empty">Tous les dossiers actifs ont une date de pose.</div>'}</div></div>`;
  $$('[data-mode]',v).forEach(b=>b.onclick=()=>{ C.mode=b.dataset.mode; renderView(); });
  const step=dir=>{ const r=new Date(C.ref); if(C.mode==='mois') r.setMonth(r.getMonth()+dir,1); else r.setDate(r.getDate()+7*dir); C.ref=r; renderView(); };
  $('#cal-prev').onclick=()=>step(-1); $('#cal-next').onclick=()=>step(1); $('#cal-today').onclick=()=>{ C.ref=new Date(); C.sel=TODAY(); renderView(); };
  $$('[data-day]',v).forEach(b=>b.onclick=()=>{ C.sel=b.dataset.day; renderView(); });

const poseCard = d => `<div class="pose-card" style="--c:${poseurColor(d.poseur)}" data-open="${d.id}"><span class="t">Pose — ${esc(fullName(d))}</span><span class="small muted">Poseur : ${esc(d.poseur||'non attribué')} · ${esc(d.client?.ville||'')}</span><span>${badge(d.statut)}</span></div>`;

  <div class="money" style="margin-bottom:14px"><div><span class="label">${lblDu}</span><div class="big num" style="margin-top:6px">${eur(tot.du)}</div></div><div><span class="label">Payé</span><div class="big num" style="margin-top:6px">${eur(tot.paye)}</div></div><div><span class="label">Restant à payer</span><div class="big num ${tot.reste?'neg':''}" style="margin-top:6px">${eur(tot.reste)}</div></div></div>
  ${S.canWrite?`<div class="toolbar"><input class="inp" id="new-ent" placeholder="Ajouter ${type==='regie'?'une régie':'un '+type}…" style="flex:1 1 200px;width:auto"><button class="btn" id="new-ent-btn">${ic('plus')}Ajouter</button></div>`:''}
  <div class="grid cols-2" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))">${items.map((e,i)=>entCard(type,e,i,stat(e))).join('')}</div>
  ${type==='commercial'?`<p class="hint" style="margin-top:14px">Acquis = commissions CEE des dossiers installés + bonus apporteur MPR des dossiers dont le MPR est payé, + commissions d’apporteur supplémentaire des dossiers installés. Un paiement coché « avance » est versé avant que le MPR soit encaissé ; s’il dépasse l’acquis, la différence apparaît en avance à imputer.</p>`:''}
  ${type==='fournisseur'?`<p class="hint" style="margin-top:14px">Total dû = matériel TTC des dossiers actifs liés au fournisseur, plus ses frais divers (monosplit…), le matériel en stock commandé chez lui et l’ajustement. Un dossier qui prend une PAC du stock n’est pas compté deux fois. Les paiements se gèrent uniquement ici.</p>`:''}
  ${type==='poseur'?`<p class="hint" style="margin-top:14px">Total dû = pose TTC des dossiers installés. « À venir » = poses des dossiers pas encore installés.</p>`:''}
  ${type==='regie'?`<p class="hint" style="margin-top:14px">Total dû = commissions CEE + MPR des dossiers de la régie passés en « Installé ». Les deux commissions se règlent dans chaque dossier (Rémunérations) ; les montants par défaut s’y mettent automatiquement. En payant, choisissez si le paiement concerne la commission CEE ou MPR. Les régies ne voient aucun montant. Pour leur donner un accès : Paramètres → Comptes d’accès au site → Accès « Régie ».</p>`:''}`;
  if(S.canWrite){ const add=()=>{ const val=$('#new-ent').value.trim().toUpperCase(); if(!val) return; addRef(type,val); renderView(); };
    $('#new-ent-btn').onclick=add; $('#new-ent').onkeydown=e=>{ if(e.key==='Enter') add(); }; }
  $$('form[data-pay]',v).forEach(f=>f.addEventListener('submit',async e=>{ e.preventDefault(); if(!db) return;
    const m=num(f.montant.value); if(!m){ f.montant.focus(); return; }
    const b=f.querySelector('button'); b.disabled=true;
    try{ await db.collection('paiements').add({type, cible:f.dataset.pay, montant:m, date:f.date.value||TODAY(), note:f.note.value.trim(), avance:!!f.avance?.checked, ...(type==='regie'?{objet:f.objet?.value||'CEE'}:{}), at:new Date().toISOString(), by:S.me.id||null});
      toast('Paiement enregistré'); f.reset(); f.date.value=TODAY(); }catch(err){ toast('Paiement non enregistré : '+(err.message||err.code)); }
    b.disabled=false; refresh(); }));
  $$('[data-delpay]',v).forEach(b=>b.onclick=()=>{ if(b.dataset.armed){ db.collection('paiements').doc(b.dataset.delpay).delete().then(()=>toast('Paiement supprimé')); } else { b.dataset.armed='1'; b.textContent='Confirmer'; b.classList.add('danger'); } });
  $$('[data-bareme]',v).forEach(inp=>inp.addEventListener('change',()=>{ const c=S.cfg.commerciaux[+inp.dataset.bareme]; c.parDossier=num(inp.value)||0; saveCfg(); toast('Barème mis à jour'); }));
  $$('[data-bonusmpr]',v).forEach(inp=>inp.addEventListener('change',()=>{ const c=S.cfg.commerciaux[+inp.dataset.bonusmpr]; c.bonusMPR=num(inp.value)||0; saveCfg(); toast('Bonus MPR mis à jour'); }));
  $$('[data-regpar]',v).forEach(inp=>inp.addEventListener('change',()=>{ const c=S.cfg.regies[+inp.dataset.regpar]; c.parDossier=num(inp.value)||0; saveCfg(); toast('Commission CEE par défaut enregistrée'); }));
  $$('[data-regparm]',v).forEach(inp=>inp.addEventListener('change',()=>{ const c=S.cfg.regies[+inp.dataset.regparm]; c.parDossierMPR=num(inp.value)||0; saveCfg(); toast('Commission MPR par défaut enregistrée'); }));
  $$('[data-ajust]',v).forEach(inp=>inp.addEventListener('change',()=>{ const c=S.cfg.fournisseurs[+inp.dataset.ajust]; c.ajustement=num(inp.value)||0; saveCfg(); toast('Ajustement enregistré'); }));
}
function entCard(type,e,i,s){
  const pays=S.paiements.filter(p=>p.type===type&&p.cible===e.nom).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const du = type==='commercial'? s.acquis : s.du;
  const figs = type==='commercial'
    ? `<div><span class="label">Acquis</span><b>${eur(s.acquis)}</b></div><div><span class="label">Payé</span><b>${eur(s.paye)}</b></div>
       <div><span class="label">${s.reste<0?'Avance à imputer':'Restant'}</span><b class="${s.reste>0?'neg':s.reste<0?'':''}">${eur(Math.abs(s.reste))}</b></div>
       <div><span class="label">Avances versées</span><b>${eur(s.avances)}</b></div><div><span class="label">Engagé total</span><b>${eur(s.engage)}</b></div><div><span class="label">Dossiers</span><b>${s.ds.length}</b></div>`
    : type==='regie' ? `<div><span class="label">Dû CEE</span><b>${eur(s.duCEE)}</b><span class="small muted">payé ${eur(s.payeCEE)}</span></div><div><span class="label">Dû MPR</span><b>${eur(s.duMPR)}</b><span class="small muted">payé ${eur(s.payeMPR)}</span></div><div><span class="label">Restant</span><b class="${s.reste>0?'neg':''}">${eur(s.reste)}</b><span class="small muted">CEE ${eur(s.resteCEE)} · MPR ${eur(s.resteMPR)}</span></div>`
    : `<div><span class="label">Total dû</span><b>${eur(s.du)}</b></div><div><span class="label">Payé</span><b>${eur(s.paye)}</b></div><div><span class="label">Restant</span><b class="${s.reste>0?'neg':''}">${eur(s.reste)}</b></div>
       ${type==='poseur'||type==='regie'?`<div><span class="label">À venir</span><b>${eur(s.avenir)}</b></div><div><span class="label">Dossiers</span><b>${s.ds.length}</b></div>`:`<div><span class="label">Dossiers</span><b>${s.ds.length}</b></div>`}
       ${type==='regie'&&s.sansCom?`<div style="grid-column:1/-1"><span class="small neg">${s.sansCom} dossier${s.sansCom>1?'s':''} sans commission renseignée</span></div>`:''}`;
  return `<div class="panel ent">
    <div class="panel-head" style="margin:0"><h2>${type==='poseur'?`<span class="dot" style="background:${poseurColor(e.nom)};margin-right:8px"></span>`:''}${esc(e.nom)}</h2>
      ${type==='commercial'?`<div style="display:flex;gap:10px;flex-wrap:wrap"><label class="small muted" style="display:flex;align-items:center;gap:6px">Commission CEE <input class="inp num" style="width:84px;min-height:34px;padding:5px 8px" data-bareme="${i}" inputmode="decimal" value="${n0(e.parDossier)}" ${S.canWrite?'':'disabled'} aria-label="Commission CEE par dossier ${esc(e.nom)}"> €</label><label class="small muted" style="display:flex;align-items:center;gap:6px">Bonus MPR <input class="inp num" style="width:84px;min-height:34px;padding:5px 8px" data-bonusmpr="${i}" inputmode="decimal" value="${n0(e.bonusMPR)}" ${S.canWrite?'':'disabled'} aria-label="Bonus MPR par dossier ${esc(e.nom)}"> €</label></div>`:''}
      ${type==='regie'?`<label class="small muted" style="display:flex;align-items:center;gap:6px">CEE <input class="inp num" style="width:80px;min-height:34px;padding:5px 8px" data-regpar="${i}" inputmode="decimal" value="${n0(e.parDossier)}" ${S.canWrite?'':'disabled'} aria-label="Commission CEE par défaut ${esc(e.nom)}"> €</label><label class="small muted" style="display:flex;align-items:center;gap:6px">MPR <input class="inp num" style="width:80px;min-height:34px;padding:5px 8px" data-regparm="${i}" inputmode="decimal" value="${n0(e.parDossierMPR)}" ${S.canWrite?'':'disabled'} aria-label="Commission MPR par défaut ${esc(e.nom)}"> €</label>`:''}
      ${type==='fournisseur'?`<label class="small muted" style="display:flex;align-items:center;gap:6px">Ajustement <input class="inp num" style="width:96px;min-height:34px;padding:5px 8px" data-ajust="${i}" inputmode="decimal" value="${n0(e.ajustement)}" ${S.canWrite?'':'disabled'} aria-label="Ajustement ${esc(e.nom)}"> €</label>`:''}</div>
    <div class="bar"><i style="width:${du?Math.min(100,s.paye/du*100):0}%;background:var(--ok)"></i></div>
    <div class="ent-figs">${figs}</div>
    ${S.canWrite?`<form class="pay-form" data-pay="${esc(e.nom)}">
      <div class="f"><label>Montant (€)</label><input class="inp num" name="montant" inputmode="decimal" required></div>
      <div class="f"><label>Date</label><input class="inp" type="date" name="date" value="${TODAY()}"></div>
      <div class="f note"><label>Note</label><input class="inp" name="note" placeholder="${type==='commercial'?'Ex. : virement, avance MPR…':'Ex. : virement facture F2609…'}"></div>
      <button class="btn primary" type="submit">Payer</button>
      ${type==='commercial'?`<label class="small" style="grid-column:1/-1;display:flex;gap:8px;align-items:center"><input type="checkbox" name="avance"> C’est une avance (MPR pas encore encaissé)</label>`:''}
      ${type==='regie'?`<div class="toggle" role="radiogroup" aria-label="Paiement de la commission" style="grid-column:1/-1;justify-self:start"><label><input type="radio" name="objet" value="CEE" checked>Commission CEE</label><label><input type="radio" name="objet" value="MPR">Commission MPR</label></div>`:''}
    </form>`:''}
    <details ${pays.length?'':''}><summary>Historique des paiements (${pays.length})</summary><div class="pays">${pays.map(p=>`<div class="pay"><span class="num" style="width:84px">${fmtDate(p.date,{day:'2-digit',month:'2-digit',year:'2-digit'})}</span><span class="grow">${esc(p.note||'Paiement')} ${p.avance?'<span class="tag">Avance</span>':''}${p.type==='regie'?`<span class="tag">${p.objet==='MPR'?'MPR':'CEE'}</span>`:''}</span><b class="num">${eur(p.montant)}</b>${S.canWrite?`<button class="btn sm ghost" data-delpay="${p.id}" aria-label="Supprimer le paiement">Suppr.</button>`:''}</div>`).join('')||'<div class="muted small" style="padding:6px 0">Aucun paiement.</div>'}</div></details>
    ${type==='fournisseur'&&s.fr.length?`<details><summary>Frais divers (${s.fr.length}) · ${eur(s.fr.reduce((a,x)=>a+n0(x.montant),0))}</summary><div class="list">${s.fr.map(x=>`<div class="li" data-go="frais"><div class="grow"><div class="t">${esc(x.categorie||'Frais')}</div><div class="small muted">${esc(x.libelle||'')}</div></div><b class="num">${eur(x.montant)}</b></div>`).join('')}</div></details>`:''}
    ${type==='fournisseur'&&s.st.length?`<details><summary>Matériel en stock ou réutilisé (${s.st.length}) · ${eur(s.st.reduce((a,x)=>a+n0(x.montant),0))}</summary><div class="list">${s.st.map(x=>`<div class="li" data-go="stock"><div class="grow"><div class="t">${esc(stockLib(x))}</div><div class="small muted">${x.statut==='Utilisé'?'Posé chez '+esc(stockDosName(x.dossierId)):'En stock'+(x.lieu?' · '+esc(x.lieu):'')}</div></div><b class="num">${eur(x.montant)}</b></div>`).join('')}</div></details>`:''}
    ${type==='commercial'&&s.sur.length?`<details><summary>Apporteur supplémentaire sur d’autres dossiers (${s.sur.length}) · ${eur(s.sur.reduce((a,x)=>a+x.montant,0))}</summary><div class="list">${s.sur.map(x=>`<div class="li" data-open="${x.d.id}"><div class="grow"><div class="t">${esc(fullName(x.d))}</div><div class="small muted">Dossier ${esc(x.d.commercial)} · ${esc(couleurDossier(x.d)||'—')}</div></div><b class="num">${eur(x.montant)}</b>${badge(x.d.statut)}</div>`).join('')}</div></details>`:''}
    <details><summary>Dossiers liés (${s.ds.length})</summary><div class="list">${s.ds.map(d=>`<div class="li" data-open="${d.id}"><div class="grow"><div class="t">${esc(fullName(d))}</div><div class="small muted">${type==='fournisseur'?'Matériel '+eur(d.materiel):type==='poseur'?'Pose '+eur(d.pose):type==='regie'?((d.regieMontant==null||d.regieMontant==='')&&(d.regieMontantMPR==null||d.regieMontantMPR==='')?'Commission à renseigner':'CEE '+eur(d.regieMontant)+' · MPR '+eur(d.regieMontantMPR)):'Commission '+eur(d.commission)+' · Bonus MPR '+eur(d.bonusApporteur)}</div></div>${badge(d.statut)}</div>`).join('')||'<div class="muted small">Aucun dossier.</div>'}</div></details>
  </div>`;
}

/* ============ Finances ============ */
function vFinances(v){
  const t=totals();
  const dec={fournisseur:0,poseur:0,commercial:0,regie:0}; S.paiements.forEach(p=>{ if(dec[p.type]!=null) dec[p.type]+=n0(p.montant); });
  const decTot=dec.fournisseur+dec.poseur+dec.commercial+dec.regie;
  const byMonth={}; S.dossiers.filter(actif).forEach(d=>{ const k=d.datePose?d.datePose.slice(0,7):'zz'; (byMonth[k] ||= []).push(d); });
  const rows=Object.keys(byMonth).sort().map(k=>{ const tt=totals(byMonth[k]); const lab=k==='zz'?'Sans date de pose':parseYmd(k+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    return `<tr style="cursor:default"><td style="text-transform:capitalize">${lab}</td><td class="r num">${byMonth[k].length}</td><td class="r num">${eur(tt.enc)}</td><td class="r num">${eur(tt.prev)}</td><td class="r num">${eur(tt.couts)}</td><td class="r num ${tt.marge<0?'neg':''}">${eur(tt.marge)}</td></tr>`; }).join('');
  const line=(l,val,cls='')=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)"><span>${l}</span><b class="num ${cls}">${eur(val)}</b></div>`;
  v.innerHTML = topBar('Finances')+moneyBlock(t)+`
  <div style="height:14px"></div>
  <div class="grid cols-3">
    <div class="panel"><div class="panel-head"><h2>Coûts des dossiers</h2></div>
      ${line('Matériel',t.materiel)}${line('Pose',t.pose)}${line('Frais supplémentaires',t.frais)}${line('Bonus apporteur MPR',t.bonus)}${line('Commissions commerciales',t.commission)}${line('Apporteurs supplémentaires',t.surcom)}${t.regie?line('Commissions régies',t.regie):''}${line('Frais divers',t.divers)}${line('Total des coûts',t.couts)}${stockVal()?line('PAC en stock, pas encore posées (hors marge)',stockVal()):''}</div>
    <div class="panel"><div class="panel-head"><h2>Marge</h2></div>
      ${line('CA prévisionnel',t.prev)}${line('− Coûts',t.couts)}${line('Marge prévisionnelle',t.marge,t.marge<0?'neg':'pos')}${line('Marge sur CA encaissé',t.margeEnc,t.margeEnc<0?'neg':'pos')}${line('Marge CEE seule (sans MPR ni reste à charge)',t.margeCEE,t.margeCEE<0?'neg':'pos')}
      <p class="hint">La marge sur encaissé déduit tous les coûts du seul CA déjà reçu.</p></div>
    <div class="panel"><div class="panel-head"><h2>Trésorerie</h2></div>
      ${line('CA encaissé',t.enc)}${line('Payé aux fournisseurs',dec.fournisseur)}${line('Payé aux poseurs',dec.poseur)}${line('Payé aux commerciaux',dec.commercial)}${dec.regie?line('Payé aux régies',dec.regie):''}${line('Solde',t.enc-decTot,t.enc-decTot<0?'neg':'pos')}</div>
  </div>
  <div style="height:14px"></div>
  <div class="panel" style="padding:0"><div class="panel-head" style="padding:16px 16px 0"><h2>Par mois de pose</h2></div>
  <div style="overflow-x:auto"><table><thead><tr><th>Mois</th><th class="r">Dossiers</th><th class="r">Encaissé</th><th class="r">Prévisionnel</th><th class="r">Coûts</th><th class="r">Marge</th></tr></thead><tbody>${rows||'<tr><td colspan="6"><div class="empty">Aucun dossier.</div></td></tr>'}</tbody></table></div></div>
  <p class="hint" style="margin-top:12px">Barèmes : CEE Bleu ${eur(S.cfg.baremeCEE.Bleu)}, Jaune/Violet/Rose ${eur(S.cfg.baremeCEE.Jaune)} · MPR Bleu ${eur(S.cfg.baremeMPR.Bleu)}, Jaune ${eur(S.cfg.baremeMPR.Jaune)}, Violet ${eur(S.cfg.baremeMPR.Violet)}, Rose ${eur(S.cfg.baremeMPR.Rose)}. Quand un montant réel est saisi dans un dossier, il remplace le barème. Un montant passe en encaissé uniquement quand son statut est « Payé ».</p>`;
}


/* ============ Frais divers ============ */

  const tot=list.reduce((a,f)=>a+n0(f.montant),0);
  const byCat={}; list.forEach(f=>{ const k=f.categorie||'Autre'; byCat[k]=(byCat[k]||0)+n0(f.montant); });
  const ds=[...S.dossiers].sort((a,b)=>fullName(a).localeCompare(fullName(b)));
  const today=TODAY();
  v.innerHTML = topBar('Frais divers')+`

    <div><span class="label">Par catégorie</span><div style="margin-top:6px;display:flex;flex-direction:column;gap:3px">${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,m])=>`<div style="display:flex;justify-content:space-between;gap:8px" class="small"><span>${esc(k)}</span><b class="num">${eur(m)}</b></div>`).join('')||'<span class="muted small">Aucun frais.</span>'}</div></div></div>

      <div class="addrow" id="fr-typerow" hidden><input class="inp" id="fr-newtype" placeholder="Nouveau type (ex. : radiateur)"><button type="button" class="btn sm primary" id="fr-typeok">Ajouter</button></div></div>
    <div class="f"><label for="fr-q">Quantité</label><input class="inp num" id="fr-q" name="q" inputmode="numeric" value="1"></div>
    <div class="f"><label for="fr-m">Montant TTC total (€)</label><input class="inp num" id="fr-m" name="m" inputmode="decimal" required></div>
    <div class="f c2"><label for="fr-lib">Détail (facultatif)</label><input class="inp" id="fr-lib" name="lib" placeholder="Ex. : Ariston Alys 3,5 kW envoyé chez le client"></div>
    <div class="f"><label for="fr-d">Date</label><input class="inp" type="date" id="fr-d" name="d" value="${today}"></div>
    <div class="f"><label for="fr-f">Fournisseur (facultatif)</label><select class="inp" id="fr-f" name="f"><option value="">Aucun</option>${S.cfg.fournisseurs.map(f=>`<option>${esc(f.nom)}</option>`).join('')}</select></div>
    <div class="f c2"><label for="fr-dos">Dossier concerné (facultatif)</label><select class="inp" id="fr-dos" name="dos"><option value="">Aucun (frais général)</option>${ds.map(d=>`<option value="${d.id}">${esc(fullName(d))}</option>`).join('')}</select></div>
    <div class="f c4"><label for="fr-n">Note</label><input class="inp" id="fr-n" name="n" placeholder="N° de facture, détail…"></div>
  </div><p class="hint">Avec un fournisseur, le montant s’ajoute à ce que vous lui devez. Avec un dossier, il entre dans les coûts de ce dossier.</p><button class="btn primary" type="submit">Ajouter le frais</button></form>`:''}
  <div class="panel"><div class="panel-head"><h2>Historique des frais</h2></div><div class="list">${list.map(f=>{ const d=S.dossiers.find(x=>x.id===f.dossierId);
    return `<div class="li" style="cursor:default;align-items:flex-start"><div class="grow"><div class="t" style="white-space:normal">${n0(f.quantite)>1?f.quantite+' × ':''}${esc(f.categorie||'Autre')}${f.libelle?` <span class="muted" style="font-weight:400">— ${esc(f.libelle)}</span>`:''}</div>
      <div class="small muted">${fmtDate(f.date,{day:'2-digit',month:'2-digit',year:'numeric'})}${f.fournisseur?' · '+esc(f.fournisseur):''}${d?` · <a href="#" data-open="${d.id}" style="color:inherit">${esc(fullName(d))}</a>`:''}</div>${f.note?`<div class="small" style="margin-top:2px">${esc(f.note)}</div>`:''}</div>
      <b class="num">${eur(f.montant)}</b>${S.canWrite?`<button class="btn sm ghost" data-delfrais="${f.id}">Suppr.</button>`:''}</div>`; }).join('')||'<div class="empty">Aucun frais divers. Ajoutez ici un monosplit, un ballon thermodynamique ou électrique envoyé à un client, un déplacement…</div>'}</div></div>`;
  $('#frais-form')?.addEventListener('submit',async e=>{ e.preventDefault(); const f=e.target; const m=num(f.m.value); if(!m){ f.m.focus(); return; }
    const b=f.querySelector('button[type=submit]'); b.disabled=true;
    try{ await db.collection('frais').add({libelle:f.lib.value.trim(),quantite:Math.max(1,parseInt(f.q.value)||1),montant:m,date:f.d.value||TODAY(),categorie:f.c.value,fournisseur:f.f.value||'',dossierId:f.dos.value||null,note:f.n.value.trim(),at:new Date().toISOString(),by:S.me.id||null});

async function syncStock(id, orig, o, toStock){
  const col=db.collection('stock'), now=new Date().toISOString();
  let next=o.stockId||'';
  const prev=orig.stockId||'';
  // dossier annulé : la PAC du stock qu'il utilisait redevient disponible
  if(o.statut==='Annulé' && next){ await db.collection('dossiers').doc(id).update({stockId:''}); next=''; }
  if(prev && prev!==next){ const x=S.stock.find(i=>i.id===prev); if(x && x.dossierId===id) await col.doc(prev).update({statut:'En stock', dossierId:null}); }
  if(next && next!==prev) await col.doc(next).update({statut:'Utilisé', dossierId:id, utiliseLe:TODAY()});
  if(toStock && n0(orig.materiel)){
    await col.add({marque:orig.marque||'', modele:orig.modele||'', fournisseur:orig.fournisseur||'', montant:n0(orig.materiel), lieu:orig.poseur||'',
      origineId:id, origineNom:fullName(orig), statut:'En stock', dossierId:null, date:TODAY(), note:'', at:now, by:S.me.id||null});
    toast('PAC mise en stock');
  }
  // dossier réactivé : on retire du stock la PAC qui venait de lui
  if(orig.statut==='Annulé' && o.statut!=='Annulé'){
    const x=S.stock.find(i=>i.origineId===id);
    if(x && x.statut!=='Utilisé'){ await col.doc(x.id).delete(); toast('Dossier réactivé : sa PAC est retirée du stock'); }
    else if(x) toast('Attention : la PAC de ce dossier a déjà été posée ailleurs');
  }
}
